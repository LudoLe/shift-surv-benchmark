# ============================================================================
# SHIFT-SURV generator configuration
# ----------------------------------------------------------------------------
# Single source of truth for every structural and per-scenario parameter of the
# synthetic benchmark.  generator/config.py reads this file; the Python
# defaults in generator/parameters.py (BaseParams, DomainParams) and
# generator/scenarios.py (the _*_shift functions) mirror these values exactly,
# so the code still runs unchanged if the file is absent.
#
# tests/test_config.py asserts the two stay in sync — if you edit a value here
# and the corresponding Python default is now stale, that test fails.
#
# Angles are given in DEGREES here for readability; keys ending in `_deg` are
# converted to radians by the loader.
# ============================================================================

# ---- Structural constants (BaseParams) -------------------------------------
base:
  k_inv: 3            # number of invariant (causal) latent factors
  k_spu: 2            # number of spurious latent factors
  p: 20               # observed covariate dimension  (overcomplete: p >> k_inv+k_spu)
  tau: 6.0            # fixed prediction horizon (months); matches real 6-month outcome
  seed: 42            # global RNG seed
  nl_strength: 0.0    # tanh nonlinear-observation strength alpha (ablation: 0.5)

# ---- Per-domain defaults (DomainParams; source, no-shift) ------------------
domain_defaults:
  sigma_noise: 0.5          # observation noise std;  Sigma = sigma_noise^2 * I_p
  beta0: 0.0                # domain intercept in log-risk
  w: [1.0, 0.5, -0.5]       # invariant risk coefficients (len = k_inv)
  v: [0.0, 0.0]             # spurious risk coefficients (len = k_spu); ALWAYS 0
  lambda0: 0.02             # Weibull baseline rate (scale)
  nu: 1.5                   # Weibull shape (>1 => increasing hazard)
  n: 500                    # samples per domain (default; swept 250-2000)
  # no-shift source prevalence at tau ~= 0.33

# ---- Per-scenario shift parameters -----------------------------------------
# Each scenario perturbs one mechanism; the target inherits domain_defaults
# unless overridden below.  Keys must match the keyword arguments of the
# corresponding _<name> function in generator/scenarios.py.
scenarios:

  no_shift: {}              # control: target == source

  covariate_shift:          # P(x) moves, P(y|u_inv) fixed; mu shifted _|_ w
    mu_inv_shift_scale: 1.5
    mu_spu_shift_scale: 1.5
    sigma_noise_target: 0.5 # unchanged from source: the shift is case-mix, not
                            # noise.  Raising sigma here would change P(x|u),
                            # i.e. the measurement model, and the regime would
                            # confound case-mix with measurement degradation --
                            # which no adaptation method can undo, because the
                            # information is destroyed rather than displaced.
                            # The noise increase lives in observational_shift.
    source_mu_scale: 0.3    # sources get random mu ~ N(0,1)*0.3
    source_sigma_base: 0.5      # source noise std, before jitter
    source_sigma_jitter: 0.1    # sigma ~ U(base-jitter, base+jitter) per source

  observational_shift:      # "measurement": mu shift + rotation of A_inv
    mu_inv_shift_scale: 1.5
    mu_spu_shift_scale: 1.5
    sigma_noise_target: 0.8
    a_inv_rotation_angle_deg: 60
    source_mu_scale: 0.3
    source_sigma_base: 0.5
    source_sigma_jitter: 0.1

  spurious_shift:           # latent u_inv<->u_spu correlation in source, broken in target
    rho_source: 0.70        # cross-block correlation of latent_cov (source)
    spu_mean_target: -2.5   # target spurious mean flips
    sigma_noise_target: 0.5 # unchanged from source: the shift is latent, not noise
    # target latent_cov = identity (independent)

  baseline_hazard_shift:    # rate shift only; ranking preserved
    lambda0_target: 0.06    # ~3x source => prevalence ~0.33 -> ~0.58
    nu_target: 1.5
    beta0_target: 0.0
    source_lambda0_base: 0.020   # sources: 0.020, 0.022, 0.024
    source_lambda0_step: 0.002
    source_nu: 1.5

  prior_shift:              # label-prior: P(y) resampled, P(x|y) fixed
    prevalence_target: 0.60

  concept_shift:            # sign flip of a subset of w; cos(w_src,w_tgt)=1/3 => oracle~0.61
    w_flip_indices: [1, 2]

  # ---- appendix scenarios ----
  shape_shift:              # Weibull shape change (nu), lambda0 rescaled for stable prevalence
    nu_target: 0.7
    source_nu: 1.5
    source_lambda0: 0.02
    # target lambda0 = source_lambda0 * tau^source_nu / tau^nu_target  (uses base.tau)

  strong_covariate_shift:   # positive control (large pure covariate shift + noise)
    spu_mean_target: 3.0
    sigma_noise_target: 1.5
    a_spu_rotation_angle_deg: 90
    source_mu_spu_scale: 0.2
    source_sigma_noise: 0.5

  cure_shift:               # mixture-cure target (non-proportional hazards)
    cure_fraction_target: 0.25
    cure_fraction_source: 0.0
    w_cure_scale: 0.5

# ---- Experiment protocol ---------------------------------------------------
experiment:
  n_seeds: 10
  n_sweep: [250, 500, 1000, 2000]
  n_source_domains_single: 1     # adaptation setting (1 source -> 1 target)
  n_source_domains_multi: 3      # generalization setting (>=2 sources; IRM/GroupDRO)
  iwcv: true                     # importance-weighted CV for DANN/CDAN HP selection
  clinical_margin_auroc: 0.02    # pre-specified smallest AUROC gain of interest
